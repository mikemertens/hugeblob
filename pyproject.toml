[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hugeblob"
version = "0.1.0"
description = "LLM-powered interface to your personal ebook library"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "qdrant-client>=1.12.0",
    "ebooklib>=0.18",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
hugeblob = "hugeblob.cli.main:app"
hugeblob-mcp = "hugeblob.mcp.server:serve"

[tool.hatch.build.targets.wheel]
packages = ["hugeblob"]

[tool.ruff]
line-length = 100
target-version = "py311"
